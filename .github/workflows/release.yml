# Builds, tests and publishes the installer.
#
#   Release: bump set(MEMENU_VERSION ...) in CMakeLists.txt, commit, then
#       git tag v0.1.0 && git push origin v0.1.0
#   The release gets memenu_installer.exe (the name install.ps1 downloads), a versioned copy and SHA256SUMS.txt.
#
#   "Run workflow" (Actions tab) builds and tests without publishing; the installer is attached to the run instead.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # Create the release and upload its files

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache   # Downloaded dependencies, cached between runs
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The runner's CMake is older than the 4.2 the project needs. Also brings Ninja.
      - uses: lukka/get-cmake@latest

      - name: Tag matches MEMENU_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run memenu version --check-tag "${{ github.ref_name }}"

      - name: Dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Libraries.cmake', 'cmake/CPM.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Toolchain
        run: uv run memenu info

      - name: Configure
        # No Doxygen on the runner: leave out the SDK docs target. Tests and installer are off by default.
        run: uv run memenu configure -c release -D MEMENU_SDK_DOCS=OFF -D MEMENU_BUILD_TESTS=ON -D MEMENU_BUILD_INSTALLER=ON

      - name: Build
        run: uv run memenu build -c release

      - name: Test
        run: uv run memenu test -c release --no-build

      - name: Package
        run: uv run memenu package --no-build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: memenu-installer
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # v2.0.1-dev, v2.1.0-rc1, ...: a pre-release, so releases/latest (what install.ps1 / install.sh get) skips it
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install

            Paste this into PowerShell and accept the administrator prompt:

            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/master/install.ps1 | iex
            ```

            Linux, Steam Deck or macOS (Proton / Wine): paste this into a terminal and follow its last step:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash
            ```

            Or download `memenu_installer.exe` below and click **Install**. Then start Mirror's Edge as usual:
            **INSERT** opens the menu, **END** unloads it. Run the command again any time to update.
