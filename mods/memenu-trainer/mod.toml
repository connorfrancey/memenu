# A first-party mod: part of the menu, written against the public API only (Lua). It ships inside the menu's DLL and
# is written to memenu\mods\memenu-trainer at startup: edit a copy under another id, not this folder.
id = "memenu-trainer"
name = "Trainer"
version = "1.0.0"
description = "The menu's trainer features as a Lua mod: God Mode, Teleport to Spawn, Game Speed"
authors = ["Mirror's Edge Menu"]
mirage = "^0.1"

[settings.game_speed]
type = "float"
name = "Multiplier"
module = "Game Speed"
description = "The world's speed"
default = 1.0
min = 0.1
max = 3.0
format = "%.2fx"
